<div class="dashboard-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-area">
      <i class="pi pi-shield logo-icon"></i>
      <span class="logo-text">SIGMAT</span>
    </div>

    <nav class="nav-menu">
      <a routerLink="home" routerLinkActive="active" class="nav-item" title="Visualizar gráficos e estatísticas">
        <i class="pi pi-chart-bar icon"></i>
        <span class="text">Visão Geral</span>
      </a>
      <a routerLink="equipment" routerLinkActive="active" class="nav-item" title="Gerenciar inventário de materiais">
        <i class="pi pi-box icon"></i>
        <span class="text">Equipamentos</span>
      </a>
      <a routerLink="loans" routerLinkActive="active" class="nav-item" title="Controlar saídas e retornos de material">
        <i class="pi pi-sync icon"></i>
        <span class="text">Cautelas Diárias</span>
      </a>
      <a routerLink="users" routerLinkActive="active" class="nav-item" title="Gestão de usuários e perfis">
        <i class="pi pi-users icon"></i>
        <span class="text">Usuários</span>
      </a>
      <a routerLink="transfers" routerLinkActive="active" class="nav-item" title="Movimentação de material entre unidades">
        <i class="pi pi-truck icon"></i>
        <span class="text">Transferência de Unidade</span>
      </a>
      <a routerLink="maintenance" routerLinkActive="active" class="nav-item" title="Gerenciar ordens de serviço">
        <i class="pi pi-wrench icon"></i>
        <span class="text">Manutenção</span>
      </a>
      <a routerLink="approvals" routerLinkActive="active" class="nav-item" title="Validar solicitações de alteração">
        <i class="pi pi-check-circle icon"></i>
        <span class="text">Aprovações</span>
      </a>
      <a routerLink="reports" routerLinkActive="active" class="nav-item" title="Exportar dados consolidados">
        <i class="pi pi-file-export icon"></i>
        <span class="text">Relatórios</span>
      </a>
      <a *ngIf="podeVerAuditoria" routerLink="audit" routerLinkActive="active" class="nav-item" title="Consultar histórico de operações (Logs)">
        <i class="pi pi-history icon"></i>
        <span class="text">Auditoria</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="main-container">
    <header class="topbar">
      <!-- O Topbar agora não tem barra de pesquisa global. A pesquisa fica por tela. -->
      <div class="search-section"></div>

      <div class="topbar-right">
        <a routerLink="approvals" class="notification-btn" title="Notificações e Pendências">
          <i class="pi pi-bell bell-icon"></i>
          <span class="custom-badge" *ngIf="totalPendentes > 0">{{ totalPendentes }}</span>
        </a>

        <div class="divider"></div>

        <div class="user-profile" *ngIf="usuario$ | async as user">
          <div class="user-info">
            <span class="user-name">{{ user.nome }}</span>
            <span class="user-role">{{ user.perfil === 'ADMIN_DTEC' ? 'Administrador' : 'Policial Militar' }}</span>
          </div>
          <div class="user-avatar" pTooltip="Ver Perfil" tooltipPosition="bottom">
            {{ user.nome.charAt(0) }}
          </div>
        </div>

        <button pButton pRipple icon="pi pi-sign-out" class="p-button-rounded p-button-text p-button-danger logout-btn" (click)="sair()" pTooltip="Sair do Sistema" tooltipPosition="bottom"></button>
      </div>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
